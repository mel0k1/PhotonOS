# Панель-док снизу; скругления и фон рисует lxqt-panel.qss темы.
# lxqt-panel 2.1: у каждого плагина из списка нужна секция с type=<имя>;
# трей - statusnotifier, часы - worldclock (tray/clock из 1.x удалены).
[General]
__userfile__=true
iconTheme=photon
panels=panel1

[panel1]
alignment=-1
animation-duration=200
desktop=0
hidable=false
hide-on-overlap=false
iconSize=22
lineCount=1
lockPanel=true
panelSize=63
plugins=mainmenu,desktopswitch,taskbar,statusnotifier,volume,worldclock
position=Bottom
reserve-space=true
visible-margin=true
width=100
width-percent=true
# show-delay НЕ ставить: lxqt-panel 2.1 трактует значение как секунды

[mainmenu]
type=mainmenu
# Кнопка меню - фирменный куб; ownIcon=true и icon= как путь к файлу
# обязательны, PNG вместо SVG (не зависит от qt6-svg-plugins)
ownIcon=true
icon=/usr/share/icons/photon/64x64/apps/start-here-photon.png
showText=false

[desktopswitch]
type=desktopswitch

[taskbar]
type=taskbar
buttonStyle=Icon
buttonWidth=49
buttonHeight=45
groupingEnabled=true

[statusnotifier]
type=statusnotifier

[volume]
type=volume

[worldclock]
type=worldclock
dateFormatType=custom
formatType=custom-timeonly
customFormat="'<b>'HH:mm'</b>'"
showWeekNumber=false
showTooltip=false
timeShowSeconds=false
