# Панель LXQt в стиле док-панели Deepin: снизу на всю ширину, крупные
# иконки без текста. Дальнейшая тонкая настройка — правый клик по панели
# -> «Настроить панель».
[General]
__userfile__=true
iconTheme=Papirus
panels=panel1

[panel1]
alignment=-1
animation-duration=0
autohide=false
hidable=false
iconSize=32
lineCount=1
lockPanel=false
panelSize=42
plugins=mainmenu,desktopswitch,taskbar,tray,volume,clock
position=Bottom
reserveSpace=true
visible-margin=true

[mainmenu]
showText=false

[taskbar]
iconOnly=true
