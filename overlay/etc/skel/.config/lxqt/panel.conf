# Панель LXQt в стиле док-панели Deepin: снизу на всю ширину, крупные
# иконки без текста. Кнопка меню — фирменный логотип (чёрный квадрат
# с глазками, start-here-photon из темы photon).
[General]
__userfile__=true
iconTheme=photon
panels=panel1

[panel1]
alignment=-1
animation-duration=0
autohide=false
hidable=false
iconSize=32
lineCount=1
lockPanel=false
panelSize=42
plugins=mainmenu,desktopswitch,taskbar,tray,volume,clock
position=Bottom
reserveSpace=true
visible-margin=true

[mainmenu]
type=mainmenu
icon=start-here-photon
showText=false

[desktopswitch]
type=desktopswitch

[taskbar]
type=taskbar
iconOnly=true

[tray]
type=tray

[volume]
type=volume

[clock]
type=clock
