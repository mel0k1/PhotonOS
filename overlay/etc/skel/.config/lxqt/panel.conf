# Панель LXQt в стиле док-панели Deepin: снизу на всю ширину, крупные
# иконки без текста. Кнопка меню — фирменный логотип (чёрный квадрат
# с глазками, start-here-photon из темы photon).
#
# ВАЖНО (lxqt-panel 2.1, Debian trixie): у КАЖДОГО плагина в списке должна
# быть своя секция с ключом type=<имя> — без неё загрузчик молча пропускает
# плагин («Section "..." not found»). Часы — плагин «worldclock» (отдельного
# «clock» в 2.x больше нет), трей — «statusnotifier» («tray» — устаревший
# мост XEmbed→SNI, современные иконки nm-applet он не показывает).
# mainmenu/desktopswitch/taskbar/statusnotifier/worldclock собраны внутрь
# бинаря lxqt-panel, volume — отдельная библиотека libvolume.so.
[General]
__userfile__=true
iconTheme=photon
panels=panel1

[panel1]
alignment=-1
animation-duration=0
autohide=false
hidable=false
iconSize=32
lineCount=1
lockPanel=false
panelSize=42
plugins=mainmenu,desktopswitch,taskbar,statusnotifier,volume,worldclock
position=Bottom
reserveSpace=true
visible-margin=true

[mainmenu]
type=mainmenu
# Без ownIcon=true плагин 2.1 игнорирует icon= и рисует дефолтный helix.svg.
ownIcon=true
icon=start-here-photon
showText=false

[desktopswitch]
type=desktopswitch

[taskbar]
type=taskbar
iconOnly=true

[statusnotifier]
type=statusnotifier

[volume]
type=volume

[worldclock]
type=worldclock
