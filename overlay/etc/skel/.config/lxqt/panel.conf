# Панель LXQt 2.1 в стиле Onyxian-Rounded: плавающая тёмная панель-док снизу
# на всю ширину; скругления, отступы и тёмный фон рисует lxqt-panel.qss темы.
# Требования темы: panelSize >= 63, iconSize = 22, кнопка задачи — только
# иконка 49x45. Правый клик по панели -> «Настроить панель».
#
# ВАЖНО (lxqt-panel 2.1, Debian trixie):
#  1) у КАЖДОГО плагина из списка должна быть секция с ключом type=<имя>,
#     иначе loadPlugins молча пропускает плагин («Section ... not found»);
#  2) имена: трей — statusnotifier (SNI), часы — worldclock (tray/clock из
#     1.x в 2.x больше нет); mainmenu/desktopswitch/taskbar/statusnotifier/
#     worldclock собраны в бинарь, volume — libvolume.so.
[General]
__userfile__=true
iconTheme=photon
panels=panel1

[panel1]
alignment=-1
animation-duration=200
desktop=0
hidable=false
hide-on-overlap=false
iconSize=22
lineCount=1
lockPanel=true
panelSize=63
plugins=mainmenu,desktopswitch,taskbar,statusnotifier,volume,worldclock
position=Bottom
reserve-space=true
show-delay=300
visible-margin=true
width=100
width-percent=true

[mainmenu]
type=mainmenu
# Кнопка меню — фирменный чёрный куб PhotonOS. ownIcon=true обязателен
# (иначе icon= игнорируется, а дефолтный helix.svg в Debian не ставится);
# icon= — ПУТЬ К ФАЙЛУ (stylesheet url()). PNG надёжнее SVG (не зависит
# от qt6-svg-plugins); SVG-исходник — в scalable/apps/start-here-photon.svg
ownIcon=true
icon=/usr/share/icons/photon/64x64/apps/start-here-photon.png
showText=false

[desktopswitch]
type=desktopswitch

[taskbar]
type=taskbar
buttonStyle=Icon
buttonWidth=49
buttonHeight=45
groupingEnabled=true

[statusnotifier]
type=statusnotifier

[volume]
type=volume

[worldclock]
type=worldclock
dateFormatType=custom
formatType=custom-timeonly
customFormat="'<b>'HH:mm'</b>'"
showWeekNumber=false
showTooltip=false
timeShowSeconds=false
