# Композитор: тени и блюр в духе док-панели. GLX - без ускорения не стартует.

backend = "glx";
vsync = true;

shadows = true;
shadow-radius = 14;
shadow-opacity = 0.35;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-exclude = [
  "name = 'Notification'",
  "window_type = 'tooltip'",
  "window_type = 'dock'",
  "_GTK_FRAME_EXTENTS@:c"
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 6;

blur-background = true;
blur-method = "dual_kawase";
blur-strength = 4;
blur-background-exclude = [
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

opacity-rule = [
  "95:class_g = 'qterminal' && focused",
  "85:class_g = 'qterminal' && !focused"
];

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 0.95; };
  notification = { fade = true; shadow = false; opacity = 0.95; };
  menu = { shadow = true; opacity = 0.98; };
};
