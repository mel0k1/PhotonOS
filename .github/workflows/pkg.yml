name: pkg

# Пробная сборка наших пакетов через xbps-src.
# Ветка: Action -> "pkg" -> Run workflow -> выбрать цепочку.
#   hyprland — стек Hyprland/MacShell (шаблоны pkg/srcpkgs, в upstream Void
#              этих пакетов нет);
#   dde      — стек DDE (на паузе, см. docs/INSTALLER.md).
on:
  workflow_dispatch:
    inputs:
      chain:
        description: Цепочка сборки
        required: true
        default: hyprland
        type: choice
        options:
          - hyprland
          - dde

concurrency:
  group: pkg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trial-build:
    name: Сборка (${{ inputs.chain }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      # тот же образ void-mklive, что и для ISO: внутри готовый xbps и root
      image: ghcr.io/void-linux/void-mklive:20250116R1
      options: --privileged
      volumes:
        - /dev:/dev
    env:
      CHAIN: ${{ inputs.chain || 'hyprland' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Зависимости контейнера
        # xbps дерева (>= 0.60) новее xbps в образе 2025-01 — обновляем хостовой
        run: xbps-install -Suy xbps; command -v git >/dev/null 2>&1 || xbps-install -Sy git

      - name: Дерево void-packages
        run: git clone --depth=1 https://github.com/void-linux/void-packages /vp

      - name: Подготовка (шаблоны + shlibs)
        run: ./pkg/build.sh /vp

      - name: binary-bootstrap
        # контейнер работает под root — xbps-src требует явного разрешения (CI)
        run: (cd /vp && ./xbps-src binary-bootstrap)
        env:
          XBPS_ALLOW_CHROOT_BREAKOUT: 1

      - name: bootstrap-update
        # в образе контейнера xbps 0.59, а свежее дерево требует >= 0.60
        run: (cd /vp && ./xbps-src bootstrap-update)
        env:
          XBPS_ALLOW_CHROOT_BREAKOUT: 1

      # Порядок = топологический. hyprland: данные -> базовые библиотеки ->
      # бэкенд -> сам композитор -> экран блокировки/простой/портал.
      # DDE: фундамент DTK -> QPA/интеграция -> библиотеки -> оболочка.
      # Остановка на первой ошибке, логи уходят в артефакты.
      - name: Сборка цепочки
        env:
          XBPS_ALLOW_CHROOT_BREAKOUT: 1
        run: |
          set -e
          cd /vp
          if [ "$CHAIN" = dde ]; then
            for p in gsettings-qt dtkcommon dtklog dtkcore dtkgui dtkwidget \
                     qt5platform-plugins qt5integration \
                     lxqt-build-tools libqtxdg dbusmenu-qt5 \
                     dde-qt-dbus-factory deepin-wayland-protocols dwayland \
                     dde-session-shell dde-launcher dde-polkit-agent dde-dock; do
              echo "::group::=== xbps-src pkg $p ==="
              ./xbps-src pkg "$p"
              echo "::endgroup::"
            done
          else
            for p in lua5.5 hwdata hyprutils hyprlang glaze hyprland-protocols \
                     aquamarine hyprcursor hyprgraphics hyprwire \
                     hyprland hyprlock hypridle xdg-desktop-portal-hyprland; do
              echo "::group::=== xbps-src pkg $p ==="
              ./xbps-src pkg "$p"
              echo "::endgroup::"
            done
          fi

      - name: Публикация артефактов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhotonOS-pkgs-${{ inputs.chain || 'hyprland' }}
          path: |
            /vp/hostdir/binpkgs/**/*.xbps
            /vp/hostdir/builddir/**/*.log
          if-no-files-found: warn
          retention-days: 14
