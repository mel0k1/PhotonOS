name: build

on:
  push:
    branches: [debian, main]
    paths-ignore:
      - '**.md'
      - 'logo/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    name: Сборка live-ISO (Debian base)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # катящийся релиз «iso»: пуш тега + загрузка актива
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Инструменты
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap squashfs-tools xorriso mtools dosfstools \
            debian-archive-keyring fakeroot

      - name: Сборка ISO
        run: |
          set -o pipefail
          sudo -E ./build/build-iso.sh 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"
        env:
          SUITE: trixie
          MIRROR: https://deb.debian.org/debian

      # При падении — лог сборки в публичную ветку ci-logs
      # (raw.githubusercontent.com отдаёт его без авторизации)
      - name: Диагностика: лог сборки в ветку ci-logs
        if: failure()
        run: |
          git config user.email "ci@photonos.invalid"
          git config user.name "ci-diag"
          git checkout -B ci-logs
          git add -f build.log
          git commit -m "ci diag: лог сборки $GITHUB_SHA" || true
          git push -f origin ci-logs

      - name: Публикация артефакта
        uses: actions/upload-artifact@v4
        with:
          name: PhotonOS-live-amd64
          path: dist/*.iso
          if-no-files-found: error
          retention-days: 14

      # Катящийся релиз «iso»: последняя сборка всегда лежит публично
      # (релизы качаются без авторизации, в отличие от артефактов).
      # Тег не пушим — gh release create сам ставит его на target commit.
      - name: Публикация в rolling-релиз «iso»
        if: github.ref == 'refs/heads/debian'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISO=$(ls dist/*.iso | head -1)
          REPO="$GITHUB_REPOSITORY"
          gh release delete iso --yes -R "$REPO" || true
          gh release create iso "$ISO" -R "$REPO" \
            --target "$GITHUB_SHA" \
            --title "PhotonOS live ISO (rolling)" \
            --notes "Последняя сборка ветки debian: $GITHUB_SHA
Файл: \`$(basename "$ISO")\`." \
          || gh release upload iso "$ISO" -R "$REPO" --clobber
