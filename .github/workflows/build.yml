name: build

on:
  push:
    branches: [debian, main]
    paths-ignore:
      - '**.md'
      - 'logo/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    name: Сборка live-ISO (Debian base)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Инструменты
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap squashfs-tools xorriso mtools dosfstools \
            debian-archive-keyring fakeroot

      - name: Сборка ISO
        run: sudo -E ./build/build-iso.sh
        env:
          SUITE: trixie
          MIRROR: https://deb.debian.org/debian

      - name: Публикация артефакта
        uses: actions/upload-artifact@v4
        with:
          name: PhotonOS-live-amd64
          path: dist/*.iso
          if-no-files-found: error
          retention-days: 14
