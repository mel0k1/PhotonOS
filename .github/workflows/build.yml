name: build

on:
  push:
    branches: [debian, main]
    paths-ignore:
      - '**.md'
      - 'logo/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    name: Сборка live-ISO (Debian base)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # катящийся релиз «iso»: пуш тега + загрузка актива
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Инструменты
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap squashfs-tools xorriso mtools dosfstools \
            debian-archive-keyring fakeroot

      - name: Сборка ISO
        run: |
          set -o pipefail
          sudo -E ./build/build-iso.sh 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"
        env:
          SUITE: trixie
          MIRROR: https://deb.debian.org/debian

      # Катящийся релиз «iso»: последняя сборка всегда лежит публично
      # (релизы качаются без авторизации, в отличие от артефактов).
      # Сюда же идёт build.log — по нему видно падения без доступа к Actions.
      - name: "Публикация rolling-релиза «iso» (ISO + лог сборки)"
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISO=$(ls dist/*.iso 2>/dev/null | head -1)
          REPO="$GITHUB_REPOSITORY"
          touch build.log
          if [ -n "$ISO" ]; then
            ARGS=("$ISO" build.log)
          else
            ARGS=(build.log)
          fi
          gh release delete iso --yes -R "$REPO" || true
          gh release create iso "${ARGS[@]}" -R "$REPO" \
            --target "$GITHUB_SHA" \
            --title "PhotonOS live ISO (rolling)" \
            --notes "Сборка ветки debian: $GITHUB_SHA (статус джобы: ${{ job.status }}). ISO: $(basename "${ISO:-НЕТ}"). build.log — полный лог сборки." \
          || gh release upload iso "${ARGS[@]}" -R "$REPO" --clobber || true

      - name: Публикация артефакта
        uses: actions/upload-artifact@v4
        with:
          name: PhotonOS-live-amd64
          path: dist/*.iso
          if-no-files-found: error
          retention-days: 14

      # Катящийся релиз «iso»: последняя сборка всегда лежит публично
      # (релизы качаются без авторизации, в отличие от артефактов).
      # Тег не пушим — gh release create сам ставит его на target commit.
      - name: Публикация в rolling-релиз «iso»
        if: github.ref == 'refs/heads/debian'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISO=$(ls dist/*.iso | head -1)
          REPO="$GITHUB_REPOSITORY"
          gh release delete iso --yes -R "$REPO" || true
          gh release create iso "$ISO" -R "$REPO" \
            --target "$GITHUB_SHA" \
            --title "PhotonOS live ISO (rolling)" \
            --notes "Последняя сборка ветки debian: $GITHUB_SHA
Файл: \`$(basename "$ISO")\`." \
          || gh release upload iso "$ISO" -R "$REPO" --clobber
