name: build

on:
  push:
    branches: [debian, main]
    paths-ignore:
      - '**.md'
      - 'logo/**'
      - 'docs/screens/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    name: Сборка live-ISO (Debian base)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # катящийся релиз «iso»: пуш тега + загрузка актива
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Инструменты
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap squashfs-tools xorriso mtools dosfstools \
            debian-archive-keyring fakeroot

      - name: Сборка ISO
        run: |
          set -o pipefail
          sudo -E ./build/build-iso.sh 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"
        env:
          SUITE: trixie
          MIRROR: https://deb.debian.org/debian

      # Катящийся релиз «iso»: последняя сборка всегда лежит публично
      # (релизы качаются без авторизации, в отличие от артефактов).
      # Сюда же идёт build.log — по нему видно падения без доступа к Actions.
      - name: "Публикация rolling-релиза «iso» (ISO + лог сборки)"
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISO=$(ls dist/*.iso 2>/dev/null | head -1)
          REPO="$GITHUB_REPOSITORY"
          touch build.log
          if [ -n "$ISO" ]; then
            ARGS=("$ISO" build.log)
          else
            ARGS=(build.log)
          fi
          gh release delete iso --yes -R "$REPO" || true
          gh release create iso "${ARGS[@]}" -R "$REPO" \
            --target "$GITHUB_SHA" \
            --title "PhotonOS live ISO (rolling)" \
            --notes "Сборка ветки debian: $GITHUB_SHA (статус джобы: ${{ job.status }}). ISO: $(basename "${ISO:-НЕТ}"). build.log — полный лог сборки." \
          || gh release upload iso "${ARGS[@]}" -R "$REPO" --clobber || true

      - name: Публикация артефакта
        uses: actions/upload-artifact@v4
        with:
          name: PhotonOS-live-amd64
          path: dist/*.iso
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------- smoke-тест
  # Загружаем собранный ISO в QEMU (TCG, headless) в двух режимах — BIOS и
  # EFI (OVMF) — снимаем скриншоты через QMP и проверяем, что рабочий стол
  # реально отрисовался: serial-маркер systemd + телеметрия photon-diag
  # (PID lxqt-session) + ненулевая яркость кадров. Артефакт photon-smoke:
  # скриншоты (shots/), serial.log, result.json, best.png на каждый режим.
  smoke:
    name: Smoke-test QEMU (BIOS + EFI/OVMF), скриншоты
    needs: iso
    runs-on: ubuntu-latest
    timeout-minutes: 55
    continue-on-error: true   # обкатка: рантайм-тест не ломает статус сборки
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ISO из сборки
        uses: actions/download-artifact@v4
        with:
          name: PhotonOS-live-amd64
          path: dist

      - name: Инструменты
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf squashfs-tools xorriso imagemagick

      - name: Санс-чек содержимого squashfs
        run: |
          ISO=$(ls dist/*.iso | head -1)
          xorriso -osirrox on -indev "$ISO" \
            -extract /live/filesystem.squashfs /tmp/fs.sqfs >/dev/null
          L=$(unsquashfs -l /tmp/fs.sqfs)
          for f in usr/bin/photon-installer \
                   usr/lib/photon_install \
                   usr/share/lxqt/themes/Onyxian-Rounded/lxqt-panel.qss \
                   usr/share/backgrounds/photon-ribbon.jpg \
                   usr/share/backgrounds/photon-flow.jpg; do
            echo "$L" | grep -q "$f" || { echo "НЕТ: $f"; exit 1; }
            echo "ок: $f"
          done

      - name: Загрузка BIOS + скриншоты
        run: |
          ISO=$(ls dist/*.iso | head -1)
          python3 scripts/ci_boot.py --iso "$ISO" --mode bios --outdir out/bios --run-install

      - name: Загрузка EFI (OVMF) + скриншоты
        run: |
          ISO=$(ls dist/*.iso | head -1)
          python3 scripts/ci_boot.py --iso "$ISO" --mode efi --outdir out/efi

      - name: "Артефакты: скриншоты и логи"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photon-smoke
          path: out/
          if-no-files-found: warn
          retention-days: 14
